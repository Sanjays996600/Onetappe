name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each check is its own job so branch protection can require them individually:
#   format · lint · typecheck · domain-tests · migration-guard · migrations · integration-tests · e2e
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Production build
        run: pnpm build

  domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @onetappe/domain test
      - name: Shared API client unit tests
        run: pnpm --filter @onetappe/api-client test
      - name: Admin panel unit tests
        run: pnpm --filter @onetappe/admin test
      - name: Mobile kit unit tests
        run: pnpm --filter @onetappe/mobile-kit test

  migration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Existing migrations are never edited, renamed or removed
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch: nothing to compare with (pull requests are always checked)."
            exit 0
          fi
          node scripts/check-migrations.mjs "$BASE"

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: onetappe, POSTGRES_PASSWORD: onetappe, POSTGRES_DB: onetappe_ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onetappe -d onetappe_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://onetappe:onetappe@localhost:5432/onetappe_ci
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply all migrations to an empty database
        run: pnpm db:migrate
      - name: Re-running migrations is a no-op
        run: pnpm db:migrate | tee out.txt && grep -q "0 applied" out.txt
      - name: Generated database types match the migrated schema
        run: pnpm --filter @onetappe/api run db:codegen:verify

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: onetappe, POSTGRES_PASSWORD: onetappe, POSTGRES_DB: onetappe_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onetappe -d onetappe_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://onetappe:onetappe@localhost:5432/onetappe_test
      # S3-compatible server for the storage adapter tests.
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY: onetappe
      TEST_S3_SECRET_KEY: onetappe-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: Start an S3-compatible server (moto)
        run: |
          pipx install 'moto[server]'
          nohup moto_server -H 127.0.0.1 -p 9000 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/ > /dev/null
      - name: Install ClamAV daemon (tests start it with a test signature)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clamav-daemon
          sudo systemctl stop clamav-daemon clamav-freshclam || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @onetappe/api test
      - name: Restore drill (dump the test database, restore it, verify data and protections)
        run: |
          sudo apt-get install -y -q postgresql-client-16
          scripts/restore-drill.sh "$TEST_DATABASE_URL"

  e2e:
    # The whole system in a real browser: API + background worker + admin panel, built as
    # for production, against a fresh PostgreSQL database with the least-privilege role.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: onetappe, POSTGRES_PASSWORD: onetappe, POSTGRES_DB: onetappe_e2e }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onetappe -d onetappe_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_OWNER_URL: postgres://onetappe:onetappe@localhost:5432/onetappe_e2e
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the browser
        run: pnpm --filter @onetappe/e2e exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm --filter @onetappe/e2e test
      - name: Keep traces and service logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/test-results
            e2e/playwright-report
            e2e/.state/logs
          retention-days: 7

  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @onetappe/web test
