name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each check is its own job so branch protection can require them individually:
#   format · lint · typecheck · domain-tests · migrations · integration-tests
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Production build
        run: pnpm build

  domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @onetappe/domain test

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: onetappe, POSTGRES_PASSWORD: onetappe, POSTGRES_DB: onetappe_ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onetappe -d onetappe_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://onetappe:onetappe@localhost:5432/onetappe_ci
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply all migrations to an empty database
        run: pnpm db:migrate
      - name: Re-running migrations is a no-op
        run: pnpm db:migrate | tee out.txt && grep -q "0 applied" out.txt
      - name: Generated database types match the migrated schema
        run: pnpm --filter @onetappe/api run db:codegen:verify

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: onetappe, POSTGRES_PASSWORD: onetappe, POSTGRES_DB: onetappe_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onetappe -d onetappe_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://onetappe:onetappe@localhost:5432/onetappe_test
      # S3-compatible storage that enforces presigned-POST policies, like S3 does.
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY: onetappe
      TEST_S3_SECRET_KEY: onetappe-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: Start MinIO (S3-compatible object storage)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=onetappe -e MINIO_ROOT_PASSWORD=onetappe-secret \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/ready && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/minio/health/ready
      - name: Install ClamAV daemon (tests start it with a test signature)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clamav-daemon
          sudo systemctl stop clamav-daemon clamav-freshclam || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @onetappe/api test
