name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onetappe
          POSTGRES_PASSWORD: onetappe
          POSTGRES_DB: onetappe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onetappe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://onetappe:onetappe@localhost:5432/onetappe_test
      TEST_DATABASE_URL: postgres://onetappe:onetappe@localhost:5432/onetappe_test
      VERIFICATION_CODE_SECRET: ci-only-secret-0123456789abcdef-0123456789

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      - name: Migrations apply cleanly and generated DB types are current
        run: |
          pnpm db:migrate
          pnpm --filter @onetappe/api run db:codegen:verify

      - run: pnpm test
