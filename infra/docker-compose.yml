# Local services: PostgreSQL and MinIO. Usage: docker compose -f infra/docker-compose.yml up -d
# The malware-scan tests also need the clamd binary (apt install clamav-daemon).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: onetappe
      POSTGRES_PASSWORD: onetappe
      POSTGRES_DB: onetappe
    ports:
      - '5432:5432'
    volumes:
      - onetappe-pg:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onetappe']
      interval: 5s
      retries: 10

  # S3-compatible storage for worker documents (tests create their own buckets).
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: onetappe
      MINIO_ROOT_PASSWORD: onetappe-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - onetappe-minio:/data

volumes:
  onetappe-pg:
  onetappe-minio:
