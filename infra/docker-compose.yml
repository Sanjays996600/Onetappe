# Local services: PostgreSQL and an S3-compatible server (moto). Usage: docker compose -f infra/docker-compose.yml up -d
# The malware-scan tests also need the clamd binary (apt install clamav-daemon).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: onetappe
      POSTGRES_PASSWORD: onetappe
      POSTGRES_DB: onetappe
    ports:
      - '5432:5432'
    volumes:
      - onetappe-pg:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onetappe']
      interval: 5s
      retries: 10

  # S3-compatible server for the document-storage tests (buckets are created by tests).
  s3:
    image: motoserver/moto:latest
    ports:
      - '9000:5000'

volumes:
  onetappe-pg:
